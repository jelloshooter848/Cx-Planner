name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install Chromium for print and PWA checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Render sample prints (headless Chromium)
        run: pnpm print:samples spike-output/chromium
      - name: Field PWA end-to-end (phone + iPad, offline)
        run: pnpm --filter @cx/field build && pnpm field:e2e
      - name: Electron spikes (SQLite + printToPDF)
        run: |
          pnpm --filter @cx/desktop run build
          cd apps/desktop
          xvfb-run -a pnpm exec electron . --no-sandbox --spike-sqlite --spike-pdf --out ../../spike-output/electron-linux
      # Drives the built app with Playwright under xvfb; the harness launches Electron with
      # --no-sandbox. The M1 flow test leaves its PDFs in spike-output/desktop-e2e/m1-flow/.
      - name: Desktop end-to-end (Electron + Playwright, xvfb)
        run: pnpm desktop:e2e
        env:
          CX_E2E_NO_BUILD: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints-linux
          path: |
            spike-output/
            !spike-output/desktop-e2e/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-linux
          path: spike-output/desktop-e2e/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-pdfs-linux
          path: spike-output/desktop-e2e/m1-flow/*.pdf
          if-no-files-found: warn

  windows:
    name: Desktop spikes and packaging (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Electron spikes (SQLite + printToPDF on Windows)
        shell: bash
        run: |
          pnpm --filter @cx/desktop run build
          cd apps/desktop
          pnpm exec electron . --spike-sqlite --spike-pdf --out ../../spike-output/electron-windows
      - name: Package unsigned app folder
        run: pnpm --filter @cx/desktop run package:dir
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints-windows
          path: spike-output/
